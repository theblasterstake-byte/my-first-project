<style>

  .t-key{font-family:var(--mono);font-size:14px;fill:var(--kuri);}

  .t-legend{font-size:14px;fill:var(--sub);}
  .mono{font-family:var(--mono);}

  .panel{fill:var(--card);stroke:var(--rule);stroke-width:1;}
  .block{fill:var(--tint);stroke:var(--rule);stroke-width:1;}
  .block-hot{fill:var(--card);stroke:var(--kuri);stroke-width:1.4;}
  .rule{stroke:var(--rule);stroke-width:1;}
  .flowline{fill:none;stroke:var(--kuri);stroke-width:1.5;}
  .dash{fill:none;stroke:var(--sub);stroke-width:1;stroke-dasharray:4 4;opacity:.75;}
  .halo{fill:var(--paper);}
  .halo-card{fill:var(--card);}
</style>

<figcaption>
お客様のフォーム送信は <code>tsukikuri.inbox.v1</code> に書き込まれ、それが管理画面の受信トレイに現れる — 送信と着信をつないでいるのはサーバーではなく、同じブラウザの localStorage である。
受信データには 100 点満点のスコアが自動で付き 3 段階に振り分けられるが、スコアは並べ替えの目安にすぎず、予約確定と来店完了の手前には必ず人の承認が挟まる。
</figcaption>
