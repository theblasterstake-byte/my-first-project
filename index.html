<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>タスク管理</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header>
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M8 12.5L10.5 15L16 9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <rect x="3" y="3" width="18" height="18" rx="6" stroke="currentColor" stroke-width="2"/>
          </svg>
        </span>
        <h1>タスク管理</h1>
        <a class="nav-link" href="minutes.html">議事録管理へ</a>
      </div>
      <div class="stats" id="summary"></div>
    </header>

    <form id="task-form" class="task-form">
      <div class="field field-full">
        <label for="task-input">タスク名</label>
        <input type="text" id="task-input" placeholder="新しいタスクを入力…" autocomplete="off" required>
      </div>

      <div class="field">
        <label for="priority-input">優先度</label>
        <select id="priority-input">
          <option value="low">低</option>
          <option value="medium" selected>中</option>
          <option value="high">高</option>
        </select>
      </div>

      <div class="field">
        <label for="category-input">カテゴリ</label>
        <input type="text" id="category-input" list="category-list" placeholder="例: 仕事(任意)" autocomplete="off">
        <datalist id="category-list"></datalist>
      </div>

      <div class="field">
        <label for="created-input">追加日</label>
        <input type="date" id="created-input">
      </div>

      <div class="field">
        <label class="checkbox-label">
          <input type="checkbox" id="due-toggle">
          期限を設定する
        </label>
        <input type="date" id="due-input" disabled>
      </div>

      <div class="field field-full">
        <label for="notes-input">備考</label>
        <textarea id="notes-input" rows="2" placeholder="備考(任意)"></textarea>
      </div>

      <button type="submit" class="field-full">追加</button>
    </form>

    <div class="toolbar">
      <div class="search-field">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/>
          <path d="M21 21L16.65 16.65" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <input type="search" id="search-input" placeholder="タスク名・備考・カテゴリで検索…">
      </div>
      <select id="sort-select">
        <option value="manual">並び替え: 手動</option>
        <option value="priority">並び替え: 優先度が高い順</option>
        <option value="due">並び替え: 期限が近い順</option>
        <option value="created-desc">並び替え: 追加日が新しい順</option>
        <option value="created-asc">並び替え: 追加日が古い順</option>
      </select>
      <select id="category-filter">
        <option value="">すべてのカテゴリ</option>
      </select>
    </div>

    <div class="filters">
      <button class="filter-btn active" data-filter="all">すべて</button>
      <button class="filter-btn" data-filter="active">未完了</button>
      <button class="filter-btn" data-filter="done">完了済み</button>
      <button id="clear-done" class="clear-btn">完了済みを削除</button>
    </div>

    <p id="drag-hint" class="drag-hint" hidden>💡 手動並び替えモードです。カードをドラッグして順序を変更できます。</p>

    <ul id="task-list" class="task-list"></ul>

    <div id="empty-state" class="empty-state" hidden>
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <rect x="3" y="5" width="18" height="16" rx="3" stroke="currentColor" stroke-width="1.6"/>
        <path d="M8 3V7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        <path d="M16 3V7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        <path d="M8 13L10.5 15.5L15.5 10.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <p id="empty-state-text">タスクはありません。上のフォームから追加してください。</p>
    </div>
  </div>

  <div id="confirm-modal" class="modal-overlay" hidden>
    <div class="modal">
      <p>このタスクを削除しますか？</p>
      <div class="modal-actions">
        <button id="confirm-cancel" class="btn-secondary">キャンセル</button>
        <button id="confirm-delete" class="btn-danger">削除する</button>
      </div>
    </div>
  </div>

  <div id="undo-toast" class="undo-toast" hidden>
    <span id="undo-message"></span>
    <button id="undo-btn">元に戻す</button>
  </div>

  <script src="app.js"></script>
</body>
</html>
