name: Deploy to GitHub Pages

# レシート家計簿（kakeibo/）を GitHub Pages に公開する。
# 事前にリポジトリ設定の Pages で Source を「GitHub Actions」にしておくこと
# （Pages の新規作成は GITHUB_TOKEN の権限では行えないため、そこだけ手作業）。

on:
  push:
    branches:
      - claude/mobile-receipt-accounting-tool-amjoja
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 公開は同時に1つだけ。走行中のものは終わらせてから次を出す。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
